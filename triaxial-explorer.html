<style>:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212d; --muted:#465366; --line:#cfd6df; --accent:#0a58a8; --accent-ink:#ffffff; --soft:#e8eef6;
  /* colour roles (Okabe-Ito based); *-ink variants are for text on white (>= 4.5:1) */
  --c-s3:#0072B2; --c-s3-ink:#005b8f;
  --c-dev:#D55E00; --c-dev-ink:#a14400;
  --c-u:#CC79A7; --c-u-ink:#94306a;
  --c-eff:#009E73; --c-eff-ink:#00694c;
  --c-tot:#4a5568; --c-tot-ink:#3a4455;
  --c-fail:#111111;
  --soil:#d7bf9e; --soil-line:#7d6340;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1b6fd1;outline-offset:2px}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:176px minmax(0,1fr) 344px;grid-template-rows:46px minmax(0,1fr) 62px 24px;grid-template-areas:"top top top" "rail center panel" "scrub scrub scrub" "note note note";min-width:0}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0f2a47;color:#fff;min-width:0}
#top h1{font-size:16px;margin:0;white-space:nowrap;font-weight:650}
#top .sub{font-size:13px;color:#d6e2f2;white-space:nowrap}
#top .sp{flex:1}
#top label{font-size:13px;color:#e6eef9;display:flex;align-items:center;gap:6px}
#top select,#top button{background:#f4f7fb;color:#0f2a47;border:1px solid #b9c7d9;border-radius:6px;padding:3px 8px;height:30px}
#top button.on{background:#ffd98e;border-color:#ffd98e;font-weight:650}
#top .lang{display:flex;gap:0}
#top .lang button{border-radius:0;height:30px}
#top .lang button:first-child{border-radius:6px 0 0 6px}
#top .lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
#rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);padding:8px 6px;overflow:auto}
#rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#rail button{width:100%;text-align:left;display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid transparent;background:transparent;border-radius:8px;line-height:1.25;font-size:13.5px}
#rail button .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
#rail button[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
#rail button[aria-current="step"] .n{background:#fff;color:var(--accent)}
#rail button:not([aria-current="step"]):hover{background:var(--soft)}
#center{grid-area:center;min-width:0;min-height:0;display:flex;flex-direction:column;padding:8px 10px 6px;gap:6px;overflow:hidden}
#goal{margin:0;font-size:14px;color:var(--ink);background:var(--soft);border-radius:8px;padding:5px 10px;flex:none}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr);gap:10px}
.cellcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.cellbox{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.readout{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;flex:none}
.readout dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:0}
.readout dt{color:var(--muted)}
.readout dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.readout .exag{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px;color:var(--muted)}
.readout .exag input{flex:1;min-width:0}
.mainarea{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.card h2{margin:0 0 4px;font-size:14px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0;position:relative;overflow:hidden}
.chart svg{display:block}
.row{display:flex;gap:8px;min-height:0;min-width:0}
.grow{flex:1;min-width:0;min-height:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;height:30px}
.tabs button[aria-pressed="true"],.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.form{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.form label{display:flex;align-items:center;gap:5px;white-space:nowrap}
.form input[type=number],.form input[type=text],.form select{height:28px;border:1px solid #9aa7b8;border-radius:6px;padding:0 6px;background:#fff;width:76px}
.form select{width:auto}
textarea.paste{width:100%;height:58px;border:1px solid #9aa7b8;border-radius:6px;padding:4px 6px;font:12.5px/1.3 ui-monospace,Consolas,monospace;resize:none;background:#fff}
.msgs{font-size:12.5px;color:var(--muted);margin:2px 0 0;padding-left:16px;max-height:54px;overflow:auto}
.msgs li.err{color:#a10d0d}
.tablewrap{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.data{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.data th{position:sticky;top:0;background:#e9eff7;text-align:right;padding:3px 7px;border-bottom:1px solid var(--line);z-index:1;font-weight:650}
table.data td{padding:2px 7px;text-align:right;border-bottom:1px solid #eef1f5}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data tr.cur td{background:#fff0c9;font-weight:650}
table.data tr.bad td{color:#a10d0d}
table.data td.why{text-align:left;font-size:12px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kind{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:13px}
.kind[aria-pressed="true"]{border-color:var(--accent);background:#eef5fd}
.kind h2{margin:0 0 2px;font-size:14.5px}
.kind p{margin:2px 0}
.kind .v{display:flex;gap:6px;align-items:center;font-size:12.5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #333;flex:none}
.dot.open{background:var(--c-eff);border-color:#00694c}
.dot.closed{background:#fff;border-color:#a10d0d}
/* panel */
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:8px 12px 10px;min-width:0}
#panel h2{font-size:14.5px;margin:0 0 6px}
.pi{border-bottom:1px solid #e6eaf0;padding:6px 0 8px}
.pi:last-of-type{border-bottom:0}
.pi .d{margin:0 0 3px;font-size:13.5px}
.pi .fx{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.pi .fx.sub{background:#f5f8fc;border-left:3px solid var(--accent);padding:4px 8px;font-size:15px;margin-top:3px}
.tag{display:inline-block;font-size:12px;background:#fff0c9;color:#5c4400;border-radius:5px;padding:0 6px;margin-top:2px}
.tag.warn{background:#fde3e3;color:#7e0b0b}
.uni{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.05em}
.fx .katex{font-size:1.08em}
#limits{margin-top:8px;font-size:13px;color:var(--muted)}
#limits summary{cursor:pointer;color:var(--ink);font-weight:600}
#limits ul{margin:4px 0 0;padding-left:18px}
.g{border-bottom:1px dotted var(--accent);cursor:help;position:relative;white-space:nowrap}
.g:hover::after,.g:focus::after{content:attr(data-def);position:absolute;left:0;top:100%;z-index:20;background:#16263a;color:#fff;font-size:12.5px;line-height:1.3;padding:5px 8px;border-radius:6px;width:230px;white-space:normal;box-shadow:0 2px 8px rgba(0,0,0,.25)}
/* scrub bar */
#scrub{grid-area:scrub;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0}
#scrub .btn{min-width:34px;padding:0 8px;font-size:15px}
#scrub input[type=range]{flex:1;min-width:120px;height:28px;accent-color:var(--accent)}
#scrub .lab{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:198px}
#scrub label{font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
#scrub select{height:28px}
#note{grid-area:note;background:#0f2a47;color:#e6eef9;font-size:12.5px;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink);padding:2px 4px}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.legend i.dash{border-top-style:dashed}
.small{font-size:12.5px;color:var(--muted)}
.errbox{background:#fde3e3;color:#7e0b0b;border-radius:8px;padding:5px 9px;font-size:13px}
.okbox{background:#e3f4ec;color:#0b4d34;border-radius:8px;padding:5px 9px;font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th,.mini td{border-bottom:1px solid #e6eaf0;padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
.mini th:first-child,.mini td:first-child{text-align:left}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <nav id="rail" aria-label="Steps"></nav>
  <main id="center"><p id="goal"></p><div id="stage"></div></main>
  <aside id="panel"><h2 id="ptitle"></h2><div id="pitems"></div><details id="limits"></details></aside>
  <section id="scrub" aria-label="Scrubber"></section>
  <footer id="note"></footer>
</div>

    if (st.type === 'CU' && T.Af !== undefined && T.Af !== null) items.push({ def: L('{Af}: áp lực nước lỗ rỗng dư lúc phá hoại chia ứng suất lệch lúc phá hoại.', '{Af}: excess pore pressure at failure divided by the deviator stress at failure.'),
      tex: [tx`A_f=\dfrac{\Delta u_f}{\Delta\sigma_{d,f}}`], sub: [tx`A_f=\dfrac{${tg(T.uF)}}{${tg(T.qdF)}}=${tg(T.Af, 3)}`] });
    return items.concat(truthItem());
  }
};

/* part C: chrome, step navigation, boot */
var STEP_NAMES = function () {
  return [L('Hiểu thí nghiệm', 'Understand the test'), L('Nhập số liệu', 'Enter the data'), L('Hiệu chỉnh diện tích', 'Area correction'), L('Ứng suất–biến dạng & phá hoại', 'Stress–strain & failure'), L('Vòng Mohr nhiều mẫu', 'Mohr circles'), L('Đường bao, c và φ', 'Envelope, c and φ'), L('Đường ứng suất & Skempton', 'Stress path & Skempton')];
};
var GOALS = function () {
  return [
    L('Biết σ₃ và σ₁ là gì, ba trục của phần tử đất, và CD, CU, UU khác nhau ở đâu.', 'Know what σ₃ and σ₁ are, the three axes of a soil element, and how CD, CU and UU differ.'),
    L('Đưa số đọc (δ, P, ΔV hoặc u) vào; kiểm tra dòng nào dùng được.', 'Enter the readings (δ, P, ΔV or u) and check which rows are usable.'),
    L('Thấy vì sao phải chia tải P cho diện tích đã thay đổi, và sai số nếu bỏ qua.', 'See why the load P is divided by the changed area, and the error if you skip it.'),
    L('Xem Δσd tăng theo biến dạng, chọn điểm phá hoại và thấy lựa chọn đó ảnh hưởng tới c, φ.', 'Watch Δσd grow with strain, pick the failure point and see how the choice moves c and φ.'),
    L('Mỗi mẫu là một vòng Mohr; với CU, vòng hữu hiệu dời sang trái đúng bằng u.', 'Each specimen is one Mohr circle; for CU the effective circle moves left by exactly u.'),
    L('Vẽ đường bao tiếp xúc các vòng phá hoại để đọc c và φ.', 'Draw the envelope touching the failure circles to read c and φ.'),
    L('Theo dõi trạng thái ứng suất của mẫu trên đồ thị s′–t (hoặc p′–q) và xem B, Af.', 'Follow the specimen’s stress state on the s′–t (or p′–q) plot and read B and Af.')
  ];
};
function buildChrome() {
  document.documentElement.lang = st.lang;
  $('#top').innerHTML = '<h1>Triaxial Explorer</h1><span class="sub">' + L('Xử lý số liệu nén ba trục — công cụ học tập', 'Triaxial test data processing — a learning tool') + '</span><span class="sp"></span>' +
    '<button type="button" id="b-csv">' + L('Xuất CSV', 'Export CSV') + '</button><button type="button" id="b-reset">' + L('Đặt lại', 'Reset') + '</button>' +
    '<span class="lang" role="group" aria-label="' + L('Ngôn ngữ', 'Language') + '"><button type="button" id="l-vi" aria-pressed="' + (st.lang === 'vi') + '" class="' + (st.lang === 'vi' ? 'on' : '') + '">VI</button><button type="button" id="l-en" aria-pressed="' + (st.lang === 'en') + '" class="' + (st.lang === 'en' ? 'on' : '') + '">EN</button></span>';
  $('#l-vi').onclick = function () { setLang('vi'); }; $('#l-en').onclick = function () { setLang('en'); };

  $('#rail').innerHTML = '<ol>' + names.map(function (n, i) { return '<li><button type="button" data-s="' + (i + 1) + '"' + (i + 1 === st.step ? ' aria-current="step"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + n + '</span></button></li>'; }).join('') + '</ol>';
  $$('#rail button').forEach(function (b) { b.onclick = function () { goStep(Number(b.dataset.s)); }; });
  $('#panel').setAttribute('aria-label', L('Công thức và số thay vào', 'Formulas and numbers'));
  $('#panel').setAttribute('tabindex', '0');
  $('#ptitle').textContent = L('Công thức & số thay vào', 'Formulas & the numbers plugged in');
  $('#note').textContent = L('Quy trình theo giáo trình; hãy kiểm tra tiêu chuẩn hiện hành (TCVN, ASTM) trước khi dùng cho công việc thực tế. Số liệu mẫu trong trang là dữ liệu giả.', 'Procedures follow the textbook; check current standards (TCVN, ASTM) before practical use. The sample data in this page are synthetic.');
  $('#limits').innerHTML = '<summary>' + L('Trang này không nói gì?', 'What this page does not say') + '</summary><ul>' +
    [L('Không đưa ra trị số thiết kế.', 'No design values.'), L('Không cho rằng đất sét luôn có φ = 0.', 'Does not assume clay always has φ = 0.'), L('Không khẳng định tuân thủ tiêu chuẩn (TCVN, ASTM).', 'No claim of compliance with standards (TCVN, ASTM).'),
      L('Không xét dị hướng, K₀, hiệu chỉnh màng cao su, góc giãn nở.', 'No anisotropy, K₀, membrane correction or dilation angle.'),
      L('Không đọc kết quả cho một loại đất thực cụ thể.', 'No reading of a specific real soil.'),
      L('Hiệu chỉnh diện tích và hồi quy đường bao là cách làm của trang, không phải từng dòng của giáo trình.', 'The area correction and the envelope regression are this page’s methods, not lines of the textbook.')].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
}
function goStep(n) {
  st.step = n; clearCharts();
  $$('#rail button').forEach(function (b) { if (Number(b.dataset.s) === n) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  $('#goal').textContent = GOALS()[n - 1];
  $('#stage').innerHTML = '<div class="cellcol"><div class="cellbox" id="cellbox"></div><div class="readout"><dl id="readout-dl"></dl><div class="exag"><label for="exag">' + L('Phóng đại độ phình', 'Bulge exaggeration') + ' ×<span id="exag-v"></span></label><input type="range" id="exag" min="1" max="10" step="1"></div></div></div><div class="mainarea" id="main"></div>';
  addChart($('#cellbox'), drawCell, cellLabel);
  var ex = $('#exag'); ex.value = String(st.exag); $('#exag-v').textContent = st.exag;
  ex.oninput = function () { st.exag = Number(ex.value); $('#exag-v').textContent = st.exag; paintAll(); };
  tableDirty = true;
  views[n].build($('#main'));
  refresh(true);
}
function setLang(l) { if (st.lang === l) return; st.lang = l; buildChrome(); buildScrub(); updateScrubUi(); goStep(st.step); }
function resetAll() {
  stopPlay(); st.cfg = { criterion: 'peakRatio', origin: false, smooth: 0, basis: 'effective', conv: 'st' }; st.mohrView = 'both'; st.curveTab = 'q'; st.exag = 4; st.guess = { c: 0, phi: 20, on: false, reveal: false };

}
function exportCsv() {
  var csv = '﻿' + TX.toCSV(AN), blob = new Blob([csv], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'triaxial-results.csv'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.addEventListener('keydown', function (e) {
  var tg0 = e.target, tag = tg0 && tg0.tagName;
  if (e.key === ' ' && !(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT' || tag === 'SUMMARY')) { e.preventDefault(); st.playing ? stopPlay() : startPlay(); }
});
views[1].basis = function () { return L('Theo giáo trình', 'From the textbook'); };
views[2].basis = function () { return L('Giả thiết đẳng hướng của trang; công thức hình học cơ bản', 'This page’s isotropic assumption; basic geometry'); };
views[3].basis = function () { return L('Thực hành phòng thí nghiệm thông dụng (không phải giáo trình)', 'Common laboratory practice (not the textbook)'); };
views[4].basis = function () { return L('Tiêu chí phá hoại là lựa chọn thực hành; giáo trình không quy định một tiêu chí duy nhất', 'The failure criterion is a practical choice; the textbook gives no single rule'); };
views[5].basis = function () { return L('Theo giáo trình', 'From the textbook'); };
views[6].basis = function () { return L('Theo giáo trình: sinφ = tanα, θ; hồi quy là cách làm của trang', 'Textbook: sinφ = tanα, θ; the regression is this page’s method'); };
views[7].basis = function () { return L('Theo giáo trình: s′–t, B, Af, p′–q', 'Textbook: s′–t, B, Af, p′–q'); };
/* boot */
loadDemo('ncClayCU'); recompute(); buildChrome(); buildScrub(); updateScrubUi(); goStep(1);
window.__TXUI.goStep = goStep; window.__TXUI.setLang = setLang; window.__TXUI.loadDemo = function (n) { loadDemo(n); commit(); };
window.__TXUI.commit = commit; window.__TXUI.csv = function () { return TX.toCSV(AN); };
})();
